services:
  db:
    image: postgres:16-alpine
    container_name: internflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: internflow
      POSTGRES_PASSWORD: internflow_dev
      POSTGRES_DB: internflow
    ports:
      - "5432:5432"
    volumes:
      - internflow_pgdata:/var/lib/postgresql/data
      - ./database/backups:/var/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internflow -d internflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: internflow-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://internflow:internflow_dev@db:5432/internflow
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "./backend/scripts/wait-for-db.sh && cd /app/backend && alembic upgrade head && python -m app.db.seed --check && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: internflow-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  internflow_pgdata: